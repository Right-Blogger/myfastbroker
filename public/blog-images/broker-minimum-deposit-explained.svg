<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg27" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg27)"/>
  <!-- Threshold line -->
  <line x1="200" y1="280" x2="1000" y2="280" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="12,6"/>
  <!-- Blocks below threshold (deposited) -->
  <rect x="300" y="350" width="120" height="50" rx="8" fill="#1d4ed8" opacity="0.5"/>
  <rect x="300" y="400" width="120" height="50" rx="8" fill="#1d4ed8" opacity="0.6"/>
  <rect x="300" y="450" width="120" height="50" rx="8" fill="#3b82f6" opacity="0.7"/>
  <rect x="440" y="380" width="120" height="50" rx="8" fill="#1d4ed8" opacity="0.5"/>
  <rect x="440" y="430" width="120" height="50" rx="8" fill="#3b82f6" opacity="0.6"/>
  <rect x="440" y="480" width="120" height="50" rx="8" fill="#1d4ed8" opacity="0.5"/>
  <!-- Blocks approaching threshold -->
  <rect x="580" y="310" width="120" height="50" rx="8" fill="#1d4ed8" opacity="0.4"/>
  <rect x="580" y="360" width="120" height="50" rx="8" fill="#3b82f6" opacity="0.5"/>
  <rect x="580" y="410" width="120" height="50" rx="8" fill="#1d4ed8" opacity="0.4"/>
  <!-- Blocks at threshold -->
  <rect x="720" y="280" width="120" height="50" rx="8" fill="#3b82f6" opacity="0.7" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="720" y="330" width="120" height="50" rx="8" fill="#3b82f6" opacity="0.6"/>
  <rect x="720" y="380" width="120" height="50" rx="8" fill="#1d4ed8" opacity="0.5"/>
  <!-- Blocks above (premium tier) -->
  <rect x="860" y="230" width="120" height="50" rx="8" fill="#60a5fa" opacity="0.6" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="860" y="280" width="120" height="50" rx="8" fill="#3b82f6" opacity="0.7"/>
  <rect x="860" y="330" width="120" height="50" rx="8" fill="#3b82f6" opacity="0.6"/>
  <!-- Threshold indicator -->
  <circle cx="1020" cy="280" r="10" fill="#60a5fa" opacity="0.8"/>
  <circle cx="1020" cy="280" r="18" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <!-- Dollar signs floating -->
  <text x="250" y="260" fill="#1d4ed8" font-size="20" font-family="sans-serif" opacity="0.3">$</text>
  <text x="500" y="260" fill="#3b82f6" font-size="20" font-family="sans-serif" opacity="0.3">$</text>
  <text x="750" y="260" fill="#60a5fa" font-size="20" font-family="sans-serif" opacity="0.4">$</text>
</svg>