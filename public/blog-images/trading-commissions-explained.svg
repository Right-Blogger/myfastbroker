<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg6)"/>
  <!-- Three pricing model cards -->
  <!-- Card 1: Fixed -->
  <rect x="100" y="120" width="280" height="380" rx="16" fill="#111133" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="130" y="150" width="220" height="40" rx="8" fill="#1d4ed8" opacity="0.3"/>
  <line x1="130" y1="220" x2="350" y2="220" stroke="#1e293b" stroke-width="1"/>
  <rect x="150" y="250" width="180" height="8" rx="4" fill="#1e3a5f"/>
  <rect x="150" y="270" width="140" height="8" rx="4" fill="#1e3a5f" opacity="0.6"/>
  <rect x="150" y="290" width="160" height="8" rx="4" fill="#1e3a5f" opacity="0.4"/>
  <!-- Fixed price tag -->
  <rect x="190" y="350" width="100" height="50" rx="10" fill="#0f1a2e" stroke="#3b82f6" stroke-width="2"/>
  <line x1="220" y1="375" x2="260" y2="375" stroke="#60a5fa" stroke-width="2"/>
  <line x1="240" y1="360" x2="240" y2="390" stroke="#60a5fa" stroke-width="1.5"/>
  <!-- Card 2: Percentage -->
  <rect x="460" y="120" width="280" height="380" rx="16" fill="#111133" stroke="#3b82f6" stroke-width="2"/>
  <rect x="490" y="150" width="220" height="40" rx="8" fill="#3b82f6" opacity="0.3"/>
  <line x1="490" y1="220" x2="710" y2="220" stroke="#1e293b" stroke-width="1"/>
  <!-- Bar chart for percentage -->
  <rect x="520" y="340" width="30" height="60" rx="4" fill="#1d4ed8" opacity="0.6"/>
  <rect x="565" y="310" width="30" height="90" rx="4" fill="#1d4ed8" opacity="0.7"/>
  <rect x="610" y="280" width="30" height="120" rx="4" fill="#3b82f6" opacity="0.8"/>
  <rect x="655" y="320" width="30" height="80" rx="4" fill="#3b82f6" opacity="0.6"/>
  <!-- Card 3: Zero commission -->
  <rect x="820" y="120" width="280" height="380" rx="16" fill="#111133" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="850" y="150" width="220" height="40" rx="8" fill="#1d4ed8" opacity="0.3"/>
  <line x1="850" y1="220" x2="1070" y2="220" stroke="#1e293b" stroke-width="1"/>
  <circle cx="960" cy="340" r="50" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="950" y="350" fill="#60a5fa" font-size="40" font-family="sans-serif" font-weight="bold" opacity="0.7">0</text>
</svg>