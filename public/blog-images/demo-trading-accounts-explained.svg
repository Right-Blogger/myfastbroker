<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg14)"/>
  <!-- Monitor/Screen frame -->
  <rect x="250" y="80" width="700" height="420" rx="20" fill="#111133" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="270" y="100" width="660" height="370" rx="10" fill="#0a0a14"/>
  <!-- Screen stand -->
  <rect x="550" y="500" width="100" height="30" rx="4" fill="#111133" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="520" y="530" width="160" height="8" rx="4" fill="#1e3a5f" opacity="0.5"/>
  <!-- Trading chart on screen -->
  <polyline points="300,380 380,350 420,370 480,320 540,340 600,280 660,300 720,250 780,270 840,220 900,200" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <polyline points="300,400 400,410 500,390 600,380 700,360 800,350 900,330" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Demo label overlay -->
  <rect x="440" y="140" width="320" height="50" rx="12" fill="#1d4ed8" opacity="0.3" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="470" y="155" width="260" height="20" rx="5" fill="#3b82f6" opacity="0.3"/>
  <!-- Play button (simulation) -->
  <circle cx="600" cy="260" r="30" fill="#1d4ed8" opacity="0.4" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="593,248 593,272 613,260" fill="#60a5fa"/>
  <!-- Virtual money indicator -->
  <rect x="320" y="140" width="100" height="30" rx="6" fill="#111133" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="335" y="148" width="70" height="14" rx="3" fill="#1d4ed8" opacity="0.3"/>
</svg>