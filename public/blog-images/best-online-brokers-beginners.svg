<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg1)"/>
  <!-- Dashboard grid -->
  <rect x="100" y="80" width="320" height="180" rx="12" fill="#111122" stroke="#1e293b" stroke-width="1"/>
  <rect x="440" y="80" width="320" height="180" rx="12" fill="#111122" stroke="#1e293b" stroke-width="1"/>
  <rect x="780" y="80" width="320" height="180" rx="12" fill="#111122" stroke="#1e293b" stroke-width="1"/>
  <!-- Highlighted card -->
  <rect x="100" y="280" width="320" height="180" rx="12" fill="#111133" stroke="#3b82f6" stroke-width="2"/>
  <rect x="100" y="280" width="320" height="180" rx="12" fill="url(#glow1)" opacity="0.3"/>
  <rect x="440" y="280" width="320" height="180" rx="12" fill="#111122" stroke="#1e293b" stroke-width="1"/>
  <rect x="780" y="280" width="320" height="180" rx="12" fill="#111122" stroke="#1e293b" stroke-width="1"/>
  <!-- Grid lines inside cards -->
  <line x1="120" y1="130" x2="220" y2="130" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="120" y1="150" x2="200" y2="150" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="120" y1="170" x2="240" y2="170" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="460" y1="130" x2="560" y2="130" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="460" y1="150" x2="540" y2="150" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="800" y1="130" x2="900" y2="130" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="800" y1="150" x2="880" y2="150" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Highlighted card details -->
  <circle cx="150" cy="340" r="20" fill="#1d4ed8" opacity="0.6"/>
  <line x1="180" y1="335" x2="300" y2="335" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="180" y1="350" x2="260" y2="350" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="180" y1="370" x2="340" y2="370" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="180" y1="390" x2="280" y2="390" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Stars on highlighted -->
  <circle cx="120" cy="420" r="5" fill="#60a5fa"/>
  <circle cx="140" cy="420" r="5" fill="#60a5fa"/>
  <circle cx="160" cy="420" r="5" fill="#60a5fa"/>
  <circle cx="180" cy="420" r="5" fill="#60a5fa"/>
  <circle cx="200" cy="420" r="5" fill="#60a5fa"/>
  <!-- Selection checkmark -->
  <circle cx="980" cy="420" r="18" fill="#1d4ed8"/>
  <polyline points="972,420 978,428 992,412" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom accent line -->
  <rect x="100" y="520" width="1000" height="2" fill="#1d4ed8" opacity="0.4"/>
  <circle cx="600" cy="520" r="4" fill="#3b82f6"/>
</svg>