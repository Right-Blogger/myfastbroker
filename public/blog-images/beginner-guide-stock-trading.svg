<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg20" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg20)"/>
  <!-- Grid lines -->
  <line x1="100" y1="150" x2="1100" y2="150" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="100" y1="250" x2="1100" y2="250" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="100" y1="350" x2="1100" y2="350" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="100" y1="450" x2="1100" y2="450" stroke="#1e293b" stroke-width="0.5"/>
  <!-- Rising chart with area fill -->
  <path d="M100,450 L200,430 L300,400 L400,420 L500,350 L600,300 L700,280 L800,220 L900,180 L1000,150 L1100,120" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <path d="M100,450 L200,430 L300,400 L400,420 L500,350 L600,300 L700,280 L800,220 L900,180 L1000,150 L1100,120 L1100,500 L100,500 Z" fill="url(#chartFill)"/>
  <!-- Entry point marker -->
  <circle cx="400" cy="420" r="10" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2.5"/>
  <circle cx="400" cy="420" r="18" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <!-- Entry line -->
  <line x1="380" y1="420" x2="420" y2="420" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- Arrow pointing up -->
  <polygon points="1050,100 1065,70 1080,100" fill="#60a5fa" opacity="0.7"/>
  <line x1="1065" y1="100" x2="1065" y2="140" stroke="#60a5fa" stroke-width="2.5" opacity="0.7"/>
  <!-- Candlestick markers -->
  <line x1="250" y1="390" x2="250" y2="410" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="246" y="395" width="8" height="12" fill="#1d4ed8" opacity="0.5"/>
  <line x1="650" y1="270" x2="650" y2="310" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="646" y="275" width="8" height="20" fill="#3b82f6" opacity="0.5"/>
</svg>