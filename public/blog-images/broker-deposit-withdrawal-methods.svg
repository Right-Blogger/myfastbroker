<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg25" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg25)"/>
  <!-- Left source -->
  <circle cx="200" cy="315" r="70" fill="#111133" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="170" y="295" width="60" height="40" rx="6" fill="#1d4ed8" opacity="0.4"/>
  <line x1="180" y1="310" x2="220" y2="310" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="180" y1="320" x2="210" y2="320" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
  <!-- Right destination (broker) -->
  <circle cx="1000" cy="315" r="70" fill="#111133" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="1000" cy="305" r="18" fill="#1d4ed8" opacity="0.5"/>
  <path d="M982,330 Q1000,350 1018,330" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <!-- Deposit arrow (top, left to right) -->
  <line x1="280" y1="220" x2="920" y2="220" stroke="#3b82f6" stroke-width="2.5"/>
  <polygon points="920,215 935,220 920,225" fill="#3b82f6"/>
  <!-- Payment method icons along deposit path -->
  <rect x="400" y="200" width="50" height="40" rx="6" fill="#111133" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="500" y="200" width="50" height="40" rx="6" fill="#111133" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="600" y="200" width="50" height="40" rx="6" fill="#111133" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="700" y="200" width="50" height="40" rx="6" fill="#111133" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="800" y="200" width="50" height="40" rx="6" fill="#111133" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Withdrawal arrow (bottom, right to left) -->
  <line x1="920" y1="410" x2="280" y2="410" stroke="#1d4ed8" stroke-width="2.5"/>
  <polygon points="280,405 265,410 280,415" fill="#1d4ed8"/>
  <!-- Withdrawal method icons -->
  <rect x="400" y="390" width="50" height="40" rx="6" fill="#111133" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="500" y="390" width="50" height="40" rx="6" fill="#111133" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="600" y="390" width="50" height="40" rx="6" fill="#111133" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="700" y="390" width="50" height="40" rx="6" fill="#111133" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Direction labels -->
  <rect x="550" y="160" width="100" height="20" rx="5" fill="#3b82f6" opacity="0.2"/>
  <rect x="550" y="440" width="100" height="20" rx="5" fill="#1d4ed8" opacity="0.2"/>
</svg>