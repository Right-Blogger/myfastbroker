<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg21" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg21)"/>
  <!-- Currency symbols floating -->
  <text x="150" y="200" fill="#1d4ed8" font-size="60" font-family="sans-serif" opacity="0.3">$</text>
  <text x="350" y="150" fill="#3b82f6" font-size="50" font-family="sans-serif" opacity="0.25">€</text>
  <text x="550" y="250" fill="#1d4ed8" font-size="55" font-family="sans-serif" opacity="0.2">£</text>
  <text x="750" y="180" fill="#3b82f6" font-size="45" font-family="sans-serif" opacity="0.25">¥</text>
  <text x="950" y="220" fill="#1d4ed8" font-size="48" font-family="sans-serif" opacity="0.2">CHF</text>
  <!-- Flowing arrows between currencies -->
  <path d="M200,220 Q350,160 400,250 Q450,340 600,280" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <path d="M600,280 Q750,200 800,300 Q850,400 1000,320" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <!-- Arrow heads -->
  <polygon points="395,245 410,250 395,258" fill="#3b82f6" opacity="0.6"/>
  <polygon points="795,295 810,300 795,308" fill="#3b82f6" opacity="0.5"/>
  <!-- Central exchange circle -->
  <circle cx="600" cy="320" r="80" fill="#111133" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="600" cy="320" r="65" fill="none" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Exchange arrows inside -->
  <path d="M570,310 L600,290 L630,310" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M570,330 L600,350 L630,330" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Flowing particles -->
  <circle cx="300" cy="200" r="4" fill="#3b82f6" opacity="0.4"/>
  <circle cx="450" cy="300" r="3" fill="#60a5fa" opacity="0.3"/>
  <circle cx="500" cy="200" r="4" fill="#3b82f6" opacity="0.35"/>
  <circle cx="700" cy="250" r="3" fill="#60a5fa" opacity="0.3"/>
  <circle cx="850" cy="350" r="4" fill="#3b82f6" opacity="0.25"/>
  <circle cx="950" cy="280" r="3" fill="#60a5fa" opacity="0.3"/>
  <!-- Bottom wave -->
  <path d="M0,520 Q200,490 400,520 Q600,550 800,520 Q1000,490 1200,520" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.3"/>
</svg>