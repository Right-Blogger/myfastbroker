<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)"/>
  <!-- Step 1: User -->
  <circle cx="150" cy="315" r="50" fill="#111133" stroke="#1e3a5f" stroke-width="1.5"/>
  <circle cx="150" cy="298" r="14" fill="#3b82f6" opacity="0.6"/>
  <path d="M128,330 Q150,355 172,330" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <!-- Arrow 1 -->
  <line x1="210" y1="315" x2="280" y2="315" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="280,310 295,315 280,320" fill="#1d4ed8"/>
  <!-- Step 2: Account -->
  <rect x="300" y="265" width="140" height="100" rx="10" fill="#111133" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="320" y="285" width="100" height="12" rx="3" fill="#1d4ed8" opacity="0.4"/>
  <rect x="320" y="305" width="80" height="12" rx="3" fill="#1d4ed8" opacity="0.3"/>
  <rect x="320" y="325" width="60" height="12" rx="3" fill="#1d4ed8" opacity="0.2"/>
  <!-- Arrow 2 -->
  <line x1="460" y1="315" x2="530" y2="315" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="530,310 545,315 530,320" fill="#1d4ed8"/>
  <!-- Step 3: Exchange -->
  <circle cx="620" cy="315" r="50" fill="#111133" stroke="#3b82f6" stroke-width="2"/>
  <line x1="590" y1="300" x2="610" y2="280" stroke="#60a5fa" stroke-width="2"/>
  <line x1="610" y1="280" x2="630" y2="310" stroke="#60a5fa" stroke-width="2"/>
  <line x1="630" y1="310" x2="650" y2="290" stroke="#60a5fa" stroke-width="2"/>
  <!-- Arrow 3 -->
  <line x1="690" y1="315" x2="760" y2="315" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="760,310 775,315 760,320" fill="#1d4ed8"/>
  <!-- Step 4: Settlement -->
  <rect x="790" y="265" width="140" height="100" rx="10" fill="#111133" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="810" y="285" width="50" height="50" rx="6" fill="#1d4ed8" opacity="0.3"/>
  <line x1="835" y1="295" x2="835" y2="325" stroke="#60a5fa" stroke-width="2"/>
  <line x1="820" y1="310" x2="850" y2="310" stroke="#60a5fa" stroke-width="2"/>
  <!-- Arrow 4 -->
  <line x1="950" y1="315" x2="1020" y2="315" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="1020,310 1035,315 1020,320" fill="#1d4ed8"/>
  <!-- Step 5: Profit -->
  <circle cx="1100" cy="315" r="50" fill="#111133" stroke="#3b82f6" stroke-width="2"/>
  <line x1="1075" y1="340" x2="1095" y2="310" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="1095" y1="310" x2="1110" y2="325" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="1110" y1="325" x2="1125" y2="290" stroke="#60a5fa" stroke-width="2.5"/>
  <!-- Subtle background circles -->
  <circle cx="600" cy="315" r="200" fill="none" stroke="#1d4ed8" stroke-width="0.5" opacity="0.15"/>
  <circle cx="600" cy="315" r="260" fill="none" stroke="#1d4ed8" stroke-width="0.5" opacity="0.1"/>
</svg>