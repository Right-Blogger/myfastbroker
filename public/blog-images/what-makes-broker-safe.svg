<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg11)"/>
  <!-- Outer glow -->
  <ellipse cx="600" cy="300" rx="250" ry="240" fill="#3b82f6" opacity="0.04"/>
  <ellipse cx="600" cy="300" rx="200" ry="190" fill="#3b82f6" opacity="0.04"/>
  <!-- Shield shape -->
  <path d="M600,100 L800,180 L800,350 Q800,500 600,570 Q400,500 400,350 L400,180 Z" fill="#111133" stroke="#3b82f6" stroke-width="3"/>
  <path d="M600,130 L775,200 L775,345 Q775,480 600,545 Q425,480 425,345 L425,200 Z" fill="url(#shield)" opacity="0.15"/>
  <!-- Inner shield line -->
  <path d="M600,165 L750,225 L750,340 Q750,460 600,520 Q450,460 450,340 L450,225 Z" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <!-- Checkmark in center -->
  <circle cx="600" cy="340" r="45" fill="#1d4ed8" opacity="0.4"/>
  <polyline points="578,340 595,360 625,318" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lock icon at top -->
  <rect x="578" y="220" width="44" height="35" rx="6" fill="#1d4ed8" opacity="0.5"/>
  <path d="M590,220 L590,208 Q590,195 600,195 Q610,195 610,208 L610,220" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
  <!-- Surrounding protection dots -->
  <circle cx="600" cy="90" r="6" fill="#3b82f6" opacity="0.5"/>
  <circle cx="820" cy="170" r="5" fill="#3b82f6" opacity="0.4"/>
  <circle cx="380" cy="170" r="5" fill="#3b82f6" opacity="0.4"/>
  <circle cx="830" cy="360" r="5" fill="#3b82f6" opacity="0.4"/>
  <circle cx="370" cy="360" r="5" fill="#3b82f6" opacity="0.4"/>
</svg>