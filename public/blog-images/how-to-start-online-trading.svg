<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg19)"/>
  <!-- Step pathway -->
  <!-- Step 1 -->
  <circle cx="150" cy="450" r="40" fill="#111133" stroke="#1e3a5f" stroke-width="2"/>
  <circle cx="150" cy="450" r="20" fill="#1d4ed8" opacity="0.4"/>
  <text x="143" y="457" fill="#60a5fa" font-size="20" font-family="sans-serif" font-weight="bold">1</text>
  <!-- Step 2 -->
  <circle cx="350" cy="380" r="40" fill="#111133" stroke="#1e3a5f" stroke-width="2"/>
  <circle cx="350" cy="380" r="20" fill="#1d4ed8" opacity="0.5"/>
  <text x="343" y="387" fill="#60a5fa" font-size="20" font-family="sans-serif" font-weight="bold">2</text>
  <!-- Step 3 -->
  <circle cx="550" cy="310" r="40" fill="#111144" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="550" cy="310" r="20" fill="#3b82f6" opacity="0.5"/>
  <text x="543" y="317" fill="#60a5fa" font-size="20" font-family="sans-serif" font-weight="bold">3</text>
  <!-- Step 4 -->
  <circle cx="750" cy="240" r="40" fill="#111144" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="750" cy="240" r="20" fill="#3b82f6" opacity="0.6"/>
  <text x="743" y="247" fill="#60a5fa" font-size="20" font-family="sans-serif" font-weight="bold">4</text>
  <!-- Step 5 (final) -->
  <circle cx="950" cy="170" r="45" fill="#0f1a2e" stroke="#60a5fa" stroke-width="2.5"/>
  <circle cx="950" cy="170" r="22" fill="#3b82f6" opacity="0.6"/>
  <text x="943" y="177" fill="#fff" font-size="22" font-family="sans-serif" font-weight="bold">5</text>
  <!-- Connection paths -->
  <line x1="190" y1="440" x2="310" y2="390" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="390" y1="370" x2="510" y2="320" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="590" y1="300" x2="710" y2="250" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="790" y1="230" x2="905" y2="180" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- Glow at final step -->
  <circle cx="950" cy="170" r="70" fill="#3b82f6" opacity="0.05"/>
  <circle cx="950" cy="170" r="90" fill="#3b82f6" opacity="0.03"/>
  <!-- Ground line -->
  <line x1="80" y1="530" x2="1080" y2="530" stroke="#1e293b" stroke-width="1.5"/>
</svg>