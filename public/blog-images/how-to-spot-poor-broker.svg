  <line x1="800" y1="400" x2="800" y2="180" stroke="#1e3a5f" stroke-width="3"/>
  <polygon points="800,180 800,280 900,230" fill="#60a5fa" opacity="0.35" stroke="#3b82f6" stroke-width="1.5"/>
