  <line x1="1060" y1="240" x2="1040" y2="260" stroke="#60a5fa" stroke-width="2.5"/>
  <!-- Ground line -->
  <line x1="100" y1="400" x2="1100" y2="400" stroke="#1e3a5f" stroke-width="1.5"/>
  <!-- Subtle background warning pattern -->
  <circle cx="350" cy="300" r="150" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.1"/>
  <circle cx="650" cy="280" r="150" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.1"/>
