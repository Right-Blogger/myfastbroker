  <polygon points="700,500 720,460 740,500" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <text x="713" y="492" fill="#60a5fa" font-size="16" font-family="sans-serif" opacity="0.5">!</text>
  <polygon points="1000,500 1020,460 1040,500" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <text x="1013" y="492" fill="#60a5fa" font-size="16" font-family="sans-serif" opacity="0.5">!</text>
  <!-- Cross/X marks -->
  <circle cx="1050" cy="350" r="20" fill="#111133" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  <line x1="1040" y1="340" x2="1060" y2="360" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="1060" y1="340" x2="1040" y2="360" stroke="#60a5fa" stroke-width="2.5"/>
  <circle cx="1050" cy="250" r="20" fill="#111133" stroke="#60a5fa" stroke-width="2" opacity="0.4"/>
