<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg17" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg17)"/>
  <!-- Gauge background arc -->
  <path d="M300,450 Q600,100 900,450" fill="none" stroke="#1e3a5f" stroke-width="20" stroke-linecap="round"/>
  <!-- Gauge colored segments -->
  <path d="M300,450 Q380,280 500,220" fill="none" stroke="#1d4ed8" stroke-width="20" stroke-linecap="round"/>
  <path d="M500,220 Q600,180 700,220" fill="none" stroke="#3b82f6" stroke-width="20" stroke-linecap="round"/>
  <path d="M700,220 Q820,280 900,450" fill="none" stroke="#60a5fa" stroke-width="20" stroke-linecap="round" opacity="0.6"/>
  <!-- Gauge needle (pointing to danger zone) -->
  <line x1="600" y1="420" x2="420" y2="250" stroke="#60a5fa" stroke-width="3"/>
  <circle cx="600" cy="420" r="12" fill="#0f1a2e" stroke="#60a5fa" stroke-width="2.5"/>
  <circle cx="600" cy="420" r="5" fill="#60a5fa"/>
  <!-- Warning triangle -->
  <polygon points="600,120 560,200 640,200" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="592" y="185" fill="#60a5fa" font-size="24" font-family="sans-serif" font-weight="bold">!</text>
  <!-- Risk level markers -->
  <circle cx="320" cy="440" r="6" fill="#1d4ed8"/>
  <circle cx="460" cy="260" r="6" fill="#1d4ed8"/>
  <circle cx="600" cy="220" r="6" fill="#3b82f6"/>
  <circle cx="740" cy="260" r="6" fill="#60a5fa"/>
  <circle cx="880" cy="440" r="6" fill="#60a5fa" opacity="0.6"/>
  <!-- Bottom bar -->
  <rect x="300" y="510" width="600" height="4" rx="2" fill="#1e3a5f" opacity="0.3"/>
  <rect x="300" y="510" width="200" height="4" rx="2" fill="#1d4ed8" opacity="0.5"/>
</svg>